<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARCHITECTS | 重力からの解放</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        /* 浮遊する建築断片のアニメーション */
        @keyframes float1 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -15px) rotate(2deg);
            }
            50% {
                transform: translate(-5px, -25px) rotate(-1deg);
            }
            75% {
                transform: translate(15px, -10px) rotate(1deg);
            }
        }

        @keyframes float2 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(-20px, 10px) rotate(-2deg);
            }
            66% {
                transform: translate(10px, 20px) rotate(1deg);
            }
        }

        @keyframes float3 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(8px, -30px) rotate(3deg);
            }
        }

        @keyframes float4 {
            0%, 100% {
                transform: translate(0, 0);
            }
            40% {
                transform: translate(-15px, -20px);
            }
            80% {
                transform: translate(20px, -10px);
            }
        }

        .floating-element-1 {
            animation: float1 8s ease-in-out infinite;
        }

        .floating-element-2 {
            animation: float2 10s ease-in-out infinite;
        }

        .floating-element-3 {
            animation: float3 7s ease-in-out infinite;
        }

        .floating-element-4 {
            animation: float4 9s ease-in-out infinite;
        }

        /* ヒーローセクションの高さ */
        .hero-section {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 背景画像レイヤー */
        .hero-bg-image {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 0;
            will-change: transform, filter;
            transition: filter 0.8s ease-out;
        }

        .hero-bg-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
            transition: filter 0.8s ease-out;
        }

        .hero-bg-image.focused img {
            filter: blur(0px);
        }

        /* 背景画像の暗めオーバーレイ */
        .hero-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(245, 245, 245, 0.75) 0%,
                rgba(245, 245, 245, 0.85) 50%,
                rgba(245, 245, 245, 0.9) 100%
            );
            z-index: 1;
        }

        /* パララックス要素 */
        .parallax-text {
            transition: transform 0.1s ease-out;
            will-change: transform;
            z-index: 2;
        }

        /* 建築断片のスタイル */
        .arch-fragment {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
            z-index: 3;
        }

        /* グラデーションオーバーレイ */
        .gradient-overlay {
            background: linear-gradient(180deg, transparent 0%, rgba(245, 245, 245, 0.8) 100%);
            z-index: 5;
        }

        /* メインコンテンツのz-index */
        .main-content {
            z-index: 10;
        }

        /* デジタル・タイポグラフィ用スタイル */
        .typo-container {
            position: relative;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .char {
            display: inline-block;
            position: relative;
            will-change: transform, opacity, text-shadow;
            opacity: 0;
            text-shadow: 0 0 0px rgba(255, 255, 255, 0);
            transition: text-shadow 0.6s ease-out;
        }

        /* 文字が集まった時の光の演出 */
        .char.assembled {
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(200, 200, 200, 0.4),
                0 0 60px rgba(150, 150, 150, 0.2);
        }

        /* レスポンシブタイポグラフィ - iPhone対応 */
        .main-title {
            font-size: clamp(3rem, 12vw, 7rem);
            letter-spacing: clamp(0.1em, 0.5vw, 0.3em);
        }

        .sub-title {
            font-size: clamp(2.5rem, 10vw, 6rem);
            letter-spacing: clamp(0.15em, 0.6vw, 0.4em);
        }

        .main-copy-text {
            font-size: clamp(1.5rem, 5vw, 3rem);
            letter-spacing: clamp(0.05em, 0.3vw, 0.15em);
        }

        /* 浮遊アニメーション（ランダム配置時） */
        @keyframes floatChar {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* グラスモーフィズム ナビゲーション */
        .glass-nav {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 0.75rem 2rem;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: floatNav 4s ease-in-out infinite;
        }

        @keyframes floatNav {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .glass-nav-link {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            color: rgba(0, 0, 0, 0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            position: relative;
        }

        .glass-nav-link:hover {
            color: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        .glass-nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background: rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .glass-nav-link:hover::after {
            width: 80%;
        }

        /* スクロールダウンインジケーター */
        .scroll-indicator {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: floatScroll 3s ease-in-out infinite;
        }

        @keyframes floatScroll {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-15px);
            }
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(
                to bottom,
                rgba(100, 100, 100, 0),
                rgba(100, 100, 100, 0.6),
                rgba(100, 100, 100, 0)
            );
        }

        .scroll-text {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: rgba(100, 100, 100, 0.8);
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* シネマティックフィルター用オーバーレイ */
        .cinematic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            background: rgba(0, 0, 0, 0);
            mix-blend-mode: multiply;
            transition: all 1s ease-out;
        }

        .cinematic-overlay.active {
            background: linear-gradient(
                135deg,
                rgba(139, 115, 85, 0.15) 0%,
                rgba(70, 60, 50, 0.1) 100%
            );
        }

        /* レスポンシブ：スマホでナビゲーションを小さく */
        @media (max-width: 640px) {
            .glass-nav {
                padding: 0.5rem 1rem;
            }

            .glass-nav-link {
                padding: 0.4rem 1rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- グラスモーフィズム ナビゲーション -->
    <nav class="glass-nav">
        <a href="#menu" class="glass-nav-link">MENU</a>
        <span style="color: rgba(0, 0, 0, 0.2); margin: 0 0.5rem;">|</span>
        <a href="#contact" class="glass-nav-link">CONTACT</a>
    </nav>

    <!-- シネマティックフィルター用オーバーレイ -->
    <div class="cinematic-overlay" id="cinematic-overlay"></div>

    <!-- ヒーローセクション -->
    <section class="hero-section flex items-center justify-center relative">
        <!-- 背景画像レイヤー -->
        <div class="hero-bg-image" id="hero-bg">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=2000" alt="Modern Architecture" loading="eager">
        </div>

        <!-- 背景オーバーレイ -->
        <div class="hero-bg-overlay"></div>

        <!-- 浮遊する建築断片 -->
        <div class="arch-fragment arch-obj floating-element-1 top-20 left-[10%] w-32 h-32 border-2 border-gray-400"></div>
        <div class="arch-fragment arch-obj floating-element-2 top-[15%] right-[15%] w-24 h-40 border-2 border-gray-400"></div>
        <div class="arch-fragment arch-obj floating-element-3 bottom-[20%] left-[20%] w-40 h-24 border-2 border-gray-400"></div>
        <div class="arch-fragment arch-obj floating-element-4 top-[40%] right-[10%] w-2 h-48 bg-gray-400"></div>
        <div class="arch-fragment arch-obj floating-element-1 bottom-[15%] right-[25%] w-28 h-28 border-2 border-gray-400 rotate-45"></div>

        <!-- パララックス背景テキスト -->
        <div class="parallax-text absolute top-[30%] left-[5%] text-9xl font-light text-gray-300 opacity-30 select-none" id="parallax-bg">
            GRAVITY
        </div>

        <!-- メインコンテンツ -->
        <div class="relative main-content text-center px-4 max-w-full">
            <h1 class="main-title font-light text-gray-900 mb-6">
                AETHER
            </h1>
            <h2 class="sub-title font-extralight text-gray-800 mb-8">
                ARCHITECTS
            </h2>
            <div class="w-24 h-px bg-gray-400 mx-auto mb-12"></div>

            <!-- デジタル・タイポグラフィ キャッチコピー -->
            <div class="typo-container mb-8">
                <p id="main-copy" class="main-copy-text font-light text-gray-800">
                    <span class="char">重</span><span class="char">力</span><span class="char">を</span><span class="char">、</span><span class="char">再</span><span class="char">定</span><span class="char">義</span><span class="char">す</span><span class="char">る</span><span class="char">。</span>
                </p>
            </div>

            <p class="text-sm md:text-base font-light text-gray-500 tracking-widest">
                REDEFINING GRAVITY
            </p>
        </div>

        <!-- グラデーションオーバーレイ（下部） -->
        <div class="gradient-overlay absolute bottom-0 left-0 right-0 h-32"></div>

        <!-- スクロールダウンインジケーター -->
        <div class="scroll-indicator">
            <div class="scroll-line"></div>
            <span class="scroll-text">SCROLL DOWN</span>
        </div>
    </section>

    <!-- 追加コンテンツ用のスペース（スクロール効果確認用） -->
    <section class="min-h-screen bg-white flex items-center justify-center">
        <div class="text-center">
            <h3 class="text-4xl font-light text-gray-900 mb-4">OUR PHILOSOPHY</h3>
            <p class="text-lg font-light text-gray-600 max-w-2xl mx-auto px-4">
                建築は地に根ざしながらも、空へと向かう。<br>
                私たちは重力という制約を、可能性へと変える。
            </p>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
